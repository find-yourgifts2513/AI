services:
  # Node.js Express Backend API Service
  - type: web
    name: ai-wardrobe-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_ENGINE_URL
        value: https://ai-wardrobe-engine.onrender.com

  # Python Computer Vision Microservice (Optional)
  - type: web
    name: ai-wardrobe-engine
    env: python
    rootDir: ai_engine
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PORT
        value: 5001
